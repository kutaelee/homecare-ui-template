<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#FBF5F2"/>
  <!-- Tall custom pantry/refrigerator unit -->
  <rect x="80" y="40" width="240" height="225" rx="6" fill="#FFFFFF" stroke="#8E8377" stroke-width="3"/>
  <rect x="90" y="50" width="105" height="135" rx="4" fill="#FAF7F2" stroke="#E4DCD0" stroke-width="2"/>
  <rect x="205" y="50" width="105" height="135" rx="4" fill="#FAF7F2" stroke="#E4DCD0" stroke-width="2"/>
  <rect x="90" y="195" width="220" height="60" rx="4" fill="#FAF7F2" stroke="#E4DCD0" stroke-width="2"/>
  <!-- Elegant vertical handles -->
  <rect x="185" y="100" width="4" height="40" rx="2" fill="#C0663A"/>
  <rect x="211" y="100" width="4" height="40" rx="2" fill="#C0663A"/>
  <!-- Shelf division lines -->
  <line x1="90" y1="225" x2="310" y2="225" stroke="#C7BCAC" stroke-dasharray="3 3"/>
</svg>
